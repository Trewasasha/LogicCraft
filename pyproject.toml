[project]
name = "logiccraft"
version = "0.1.0"
description = "UML Architect with Simulation and Codegen"
authors = [
    {name = "Trewas345", email = "vazheninsaha@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "flet>=0.25.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "transitions>=0.9.0",
    "jinja2>=3.1.0"
]

[tool.poetry]
packages = [{include = "logiccraft", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"