[project]
name = "logiccraft"
version = "0.1.0"
description = "UML Architect with Simulation and Codegen"
authors = [
    {name = "Trewas345", email = "vazheninsaha@gmail.com"}
]
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "transitions>=0.9.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.2.0",
]

# Optional: Add classifiers for PyPI
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Documentation"
]

# Optional: Add dynamic metadata
dynamic = ["readme"]

# Optional: Add scripts for easy execution
[project.scripts]
logiccraft = "logiccraft.main:main"

# Optional: Add GUI scripts
[project.gui-scripts]
logiccraft-gui = "logiccraft.main:main"

# Package configuration
[tool.poetry]
packages = [{include = "logiccraft", from = "src"}]

# Add development dependencies
[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"
pre-commit = "^3.5.0"
pytest-qt = "^4.2.0"

# Build system configuration
hypothesis = ">=6.0.0,<6.100.0"
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Tool configurations
[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["src"]
omit = ["*/test/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]